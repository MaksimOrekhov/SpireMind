name: SpireMind checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Build and contract tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: python scripts/setup.py --source-only
      - run: python scripts/setup.py --check-source
      - run: python scripts/prepare_observer.py
      - run: python scripts/prepare_observer.py --native-current --output .local/observer-source-native
      - name: Test producer lease and native projection without game assemblies
        if: runner.os == 'Windows'
        run: dotnet run --project tests/observer/ObserverTests.csproj --artifacts-path .local/observer-tests -c Release
      - run: cargo fetch --locked
      - name: Select installed MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC build tools not found' }
          $lines = cmd.exe /d /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >NUL && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lines | Where-Object { $_ -match '^(VCINSTALLDIR|VCToolsInstallDir|INCLUDE|LIB|LIBPATH|PATH)=' } | Add-Content -Encoding utf8 $env:GITHUB_ENV
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --offline --all-targets -- -D warnings
      - run: cargo build --release --locked --offline
      - run: cargo test --release --locked --offline

  model-smoke:
    name: Original Instinct CPU smoke (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: python scripts/setup.py
      - run: python scripts/setup.py --check-source
      - run: cargo fetch --locked
      - name: Real model smoke with MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC build tools not found' }
          cmd.exe /d /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >NUL && cargo test --release --locked --offline model_smoke -- --ignored --nocapture"
          exit $LASTEXITCODE
