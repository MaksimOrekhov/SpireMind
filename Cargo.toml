[package]
name = "spiremind"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sts2-advisor = { path = ".local/upstream/sts2-rs/crates/sts2-advisor" }
sts2-core = { path = ".local/upstream/sts2-rs/crates/sts2-core" }
sts2-e2e = { path = ".local/upstream/sts2-rs/crates/sts2-e2e" }
sts2-wire = { path = ".local/upstream/sts2-rs/crates/sts2-wire" }

[profile.release]
lto = "thin"
codegen-units = 16
